<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="450" viewBox="0 0 1040 450" role="img" aria-labelledby="title desc">
<title id="title">Nimbus deployment choices</title><desc id="desc">Finance owns the local ledger. Optional on-device Runtime needs no server. Optional sync and inference go through private Tailscale HTTPS to the user's server. Owners manage the server through a localhost dashboard.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#bdadff"/></marker></defs>
<rect width="1040" height="450" rx="20" fill="#14131f"/>
<g font-family="Arial,sans-serif" fill="#faf8ff"><text x="30" y="43" font-size="24">Nimbus · local finance with optional AI and sync</text>
<rect x="25" y="70" width="300" height="345" rx="20" fill="#29203c" stroke="#9c80c7"/><text x="45" y="102" font-size="18">Your phone</text>
<rect x="45" y="128" width="260" height="95" rx="14" fill="#6039a4"/><text x="62" y="158" font-size="19">Nimbus Finance</text><text x="62" y="187" font-size="15">Local ledger + finance calculations</text><text x="62" y="208" font-size="15">Validated read-only AI tools</text>
<path d="M170 225V284" stroke="#bdadff" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/><text x="190" y="260" font-size="14">Local IPC</text>
<rect x="45" y="292" width="260" height="80" rx="14" fill="#3c334c"/><text x="62" y="322" font-size="18">AI Runtime (optional)</text><text x="62" y="349" font-size="15">Downloaded on-device model</text><text x="45" y="397" font-size="14">Finance also works without AI.</text>
<path d="M305 177H587" stroke="#bdadff" stroke-width="3" marker-start="url(#a)" marker-end="url(#a)"/><text x="346" y="145" font-size="16">Tailscale · private HTTPS</text><text x="351" y="207" font-size="14">Optional sync / inference</text>
<rect x="590" y="70" width="425" height="345" rx="20" fill="#233039" stroke="#8aaab8"/><text x="610" y="102" font-size="18">Your server · built from source</text>
<rect x="610" y="128" width="385" height="95" rx="14" fill="#42516b"/><text x="630" y="163" font-size="20">Authenticated Finance API</text><text x="630" y="194" font-size="15">Private access via Tailscale Serve</text>
<path d="M690 224V269M900 224V269" stroke="#bdadff" stroke-width="2" marker-end="url(#a)"/>
<rect x="610" y="276" width="179" height="72" rx="12" fill="#364453"/><text x="625" y="303" font-size="17">PostgreSQL</text><text x="625" y="327" font-size="14">Sync data + backups</text>
<rect x="805" y="276" width="190" height="72" rx="12" fill="#364453"/><text x="820" y="303" font-size="17">Optional inference</text><text x="820" y="327" font-size="14">Owner-selected model</text>
<text x="348" y="305" font-size="17">Owner dashboard</text><text x="348" y="330" font-size="14">Localhost / SSH tunnel</text><path d="M445 286V243H638V225" fill="none" stroke="#bdadff" stroke-width="2" marker-end="url(#a)"/>
<text x="610" y="385" font-size="14">No public database or model-engine ports.</text></g></svg>
