name: nimbus-finance

services:
  finance-db:
    image: nimbus-finance-postgres:17
    build:
      context: .
      dockerfile: infrastructure/postgres/Dockerfile
      args:
        POSTGRES_BASE_IMAGE: ${POSTGRES_BASE_IMAGE:-alpine:3.23.3@sha256:25109184c71bdad752c8312a8623239686a9a2071e8825f20acb8f2198c3f659}
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.5
    pids_limit: 160
    environment:
      POSTGRES_DB: nimbus
      POSTGRES_USER: nimbus
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - finance-db-data:/var/lib/postgresql/data
    networks:
      - finance-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nimbus -d nimbus"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  finance-api:
    build:
      context: .
      dockerfile: server/Dockerfile
      args:
        SERVER_BASE_IMAGE: ${SERVER_BASE_IMAGE:-eclipse-temurin:17-jre-jammy@sha256:e17d77fb030dd4b642dc078d048a5fb9efcb3676ee20305d905949105a6ccd5a}
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 160
    tmpfs:
      # Argon2's JNA library is unpacked here and must be executable.
      - /tmp:rw,exec,nosuid,size=32m,mode=1777
    environment:
      PORT: "8080"
      JDBC_DATABASE_URL: jdbc:postgresql://finance-db:5432/nimbus
      DB_USER: nimbus
      DB_PASSWORD_FILE: /run/secrets/postgres_password
      FINANCE_ADMIN_KEY_FILE: /run/secrets/finance_admin_key
      BUILD_VERSION: "1.0.0"
      BUILD_REVISION: ${BUILD_REVISION:-unknown}
      BUILD_TIME: ${BUILD_TIME:-unknown}
      SERVER_SCHEMA_VERSION: "3"
      PUBLIC_SERVER_URL: ${PUBLIC_SERVER_URL:-}
      INFERENCE_BASE_URL: http://nimbus-inference:8080
      INFERENCE_SESSION_IDLE_MINUTES: ${INFERENCE_SESSION_IDLE_MINUTES:-30}
      INFERENCE_MAX_SESSIONS_PER_USER: ${INFERENCE_MAX_SESSIONS_PER_USER:-3}
      INFERENCE_CONFIG_DIRECTORY: /inference-config
      INFERENCE_MODELS_DIRECTORY: /models
    secrets:
      - postgres_password
      - finance_admin_key
    ports:
      - "127.0.0.1:${FINANCE_API_PORT:-8080}:8080"
    volumes:
      - ./models:/models:ro
      - ./data/inference:/inference-config
    networks:
      - finance-internal
      - finance-edge
      - inference-internal
    depends_on:
      finance-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 20s

  nimbus-inference:
    image: ${INFERENCE_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda-b10666@sha256:a2d04d1d1c2b2abe287fef9a22a3700a7fa20aec4c4ab56135e0099f38119848}
    profiles: ["inference"]
    restart: unless-stopped
    gpus: all
    read_only: true
    user: "65532:65532"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${INFERENCE_MEMORY_LIMIT:-8g}
    cpus: ${INFERENCE_CPUS:-6.0}
    pids_limit: 256
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=256m,mode=1777
    environment:
      LLAMA_CACHE: /model-cache
    command:
      - --models-preset
      - /inference-config/models.ini
      - --models-max
      - "1"
      - --models-autoload
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --metrics
      - --no-webui
      - --sse-ping-interval
      - "5"
    volumes:
      - ./models:/models:ro
      - ./data/inference:/inference-config:ro
      - ./data/model-cache:/model-cache
    networks:
      - inference-internal
    depends_on:
      finance-api:
        condition: service_healthy

  finance-backup:
    build:
      context: .
      dockerfile: infrastructure/backup/Dockerfile
      args:
        BACKUP_BASE_IMAGE: ${BACKUP_BASE_IMAGE:-alpine:3.23.3@sha256:25109184c71bdad752c8312a8623239686a9a2071e8825f20acb8f2198c3f659}
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    cpus: 0.75
    pids_limit: 64
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=128m,mode=1777
    environment:
      PGHOST: finance-db
      PGUSER: nimbus
      PGDATABASE: nimbus
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      BACKUP_PASSPHRASE_FILE: /run/secrets/backup_passphrase
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    secrets:
      - postgres_password
      - backup_passphrase
    volumes:
      - ./data/backups:/backups
    networks:
      - finance-internal
    depends_on:
      finance-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /backups/.last-success-epoch && now=$$(date -u +%s) && last=$$(cat /backups/.last-success-epoch) && test $$((now-last)) -le $$((BACKUP_INTERVAL_SECONDS*2+3600))"]
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 2m

  tailscale:
    image: nimbus-finance-tailscale:stable
    build:
      context: .
      dockerfile: infrastructure/tailscale/Dockerfile
      args:
        TAILSCALE_BASE_IMAGE: ${TAILSCALE_IMAGE:-tailscale/tailscale:stable@sha256:8c42c4574ab066384fcb72f69e086a2ff1dd3652eb6f56856cee34bcf0d2f680}
    profiles: ["tailscale"]
    hostname: ${TAILSCALE_HOSTNAME:-nimbus-finance}
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 128
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=32m,mode=1777
    environment:
      TS_AUTHKEY: file:/run/secrets/tailscale_auth_key
      TS_STATE_DIR: /var/lib/tailscale
      TS_HOSTNAME: ${TAILSCALE_HOSTNAME:-nimbus-finance}
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/serve.json
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: 127.0.0.1:9002
    secrets:
      - tailscale_auth_key
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./infrastructure/tailscale:/config:ro
    networks:
      - finance-edge
    depends_on:
      finance-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9002/healthz"]
      interval: 10s
      timeout: 4s
      retries: 20
      start_period: 20s

secrets:
  postgres_password:
    file: ./.secrets/postgres_password
  finance_admin_key:
    file: ./.secrets/finance_admin_key
  backup_passphrase:
    file: ./.secrets/backup_passphrase
  tailscale_auth_key:
    file: ./.secrets/tailscale_auth_key

volumes:
  finance-db-data:
  tailscale-state:

networks:
  finance-internal:
    internal: true
  inference-internal:
    internal: true
  finance-edge:
